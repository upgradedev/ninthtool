name: Readiness

# DELIBERATELY NOT ON pull_request. This gate measures the DEPLOYED submission: it opens the live
# judge URL in a browser, presses the button, and compares the served bytes with the tree. A branch
# is not deployed, so on a pull request those rows can only report that the deployment is behind,
# which is true and useless. Asking a question with no meaningful answer and then calling the result
# a failure teaches everyone to ignore the gate.
#
# The rows that CAN be judged from a branch are already on the CI workflow: unit tests, the style
# gate and its selftest, and the manifest freshness check. This one runs where its answer means
# something.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # The live URL has to keep answering 200 through the judging window. A daily run is how we
    # find out it stopped, rather than a judge finding out.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  readiness:
    name: Readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: The gate proves it can fail
        run: node scripts/readiness.mjs --selftest

      # WAIT ON THE MANIFEST, NOT ON ONE FILE.
      #
      # This step used to compare the served behaviours.js with the committed one. That is the
      # wrong signal twice over: it says nothing when the commit did not touch that file, and it
      # said exactly nothing on the commit that ADDED runtime-manifest.json, so the gate ran against
      # an origin with no manifest and failed with a 404 nobody could act on.
      #
      # The manifest changes whenever any runtime file changes, and when nothing runtime changed
      # there is nothing to wait for. It is the right thing to poll.
      #
      # Line endings are stripped with tr rather than a regex. An earlier version put a JavaScript
      # regex inside a YAML block scalar inside a shell string, and the escaping turned into real
      # newlines and broke the workflow file itself, which failed in zero seconds with no log.
      - name: Wait for Pages to serve this commit
        run: |
          set -u
          want=$(tr -d '\r' < runtime-manifest.json | md5sum | cut -d' ' -f1)
          echo "committed manifest $want"
          for i in $(seq 1 60); do
            got=$(curl -fsS "https://upgradedev.github.io/ninthtool/runtime-manifest.json?cb=$i" 2>/dev/null | tr -d '\r' | md5sum | cut -d' ' -f1) || got="not-served-yet"
            if [ "$got" = "$want" ]; then
              echo "Pages is serving this manifest after $i tries."
              exit 0
            fi
            echo "  try $i: served $got"
            sleep 10
          done
          echo "Pages never served this commit's manifest, so the gate would measure a stale origin."
          exit 1

      # The browser row drives the LIVE judge URL and presses the button a visitor presses. It is
      # mandatory, and a row that could not be run is never counted as a pass, so a runner with no
      # Chrome makes this job red rather than quietly green.
      - name: Readiness, live and driven
        run: node scripts/readiness.mjs
