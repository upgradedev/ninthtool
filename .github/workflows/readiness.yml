name: Readiness

# DELIBERATELY NOT ON pull_request. This gate measures the DEPLOYED submission: it opens the live
# judge URL in a browser, presses the button, and compares the served bytes with the tree. A branch
# is not deployed, so on a pull request those rows can only report that the deployment is behind,
# which is true and useless. Asking a question with no meaningful answer and then calling the result
# a failure teaches everyone to ignore the gate.
#
# The rows that CAN be judged from a branch are already on the CI workflow: unit tests, the style
# gate and its selftest. This one runs where its answer means something.
on:
  push:
    branches: [main]
  workflow_dispatch:
  schedule:
    # The live URL has to keep answering 200 through the judging window. A daily run is how we
    # find out it stopped, rather than a judge finding out.
    - cron: '17 6 * * *'

permissions:
  contents: read

jobs:
  readiness:
    name: Readiness gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Where is Chrome
        id: chrome
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /opt/google/chrome/chrome; do
            if [ -x "$c" ]; then echo "found=$c" >> "$GITHUB_OUTPUT"; echo "Chrome at $c"; exit 0; fi
          done
          echo "found=" >> "$GITHUB_OUTPUT"
          echo "No Chrome on this runner."

      - name: The gate proves it can fail
        run: node scripts/readiness.mjs --selftest

      # WAIT FOR THE DEPLOYMENT, DO NOT WEAKEN THE CHECK. On a push to main this job starts before
      # Pages has rebuilt, so the gate correctly reported that the deployment was behind and went
      # red for a reason nobody could act on. The answer is to wait for the thing being measured,
      # not to stop measuring it: this polls until the served catalogue matches the one in this
      # commit, and gives up loudly after ten minutes rather than running against a stale origin.
      - name: Wait for Pages to serve this commit
        run: |
          set -u
          want=$(node -e "const fs=require('fs');process.stdout.write(fs.readFileSync('src/judge/behaviours.js','utf8').replace(/\s+/g,' ').trim())" | md5sum | cut -d' ' -f1)
          echo "want $want"
          for i in $(seq 1 60); do
            got=$(curl -fsS "https://upgradedev.github.io/ninthtool/src/judge/behaviours.js?cb=$i"               | node -e "let d='';process.stdin.on('data',c=>d+=c).on('end',()=>process.stdout.write(d.replace(/\s+/g,' ').trim()))"               | md5sum | cut -d' ' -f1) || got="fetch-failed"
            if [ "$got" = "$want" ]; then echo "Pages is serving this commit after ${i} tries."; exit 0; fi
            echo "  try $i: served $got"
            sleep 10
          done
          echo "Pages never served this commit. The gate would measure a stale origin, so this fails here instead."
          exit 1

      # The browser row drives the LIVE judge URL and presses the button a visitor presses. It is
      # mandatory, and a row that could not be run is never counted as a pass, so a runner with no
      # Chrome makes this job red rather than quietly green.
      - name: Readiness, live and driven
        run: node scripts/readiness.mjs
