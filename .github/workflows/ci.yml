name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  tests:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # No package manager runs here. This repository declares no dependencies and has no lock
      # file, so there is nothing to install and nothing to cache.
      - name: node --test
        run: node --test tests/unit

      # The manifest is the deployment's identity and readiness row R5 compares the live origin
      # against it. A forgotten regeneration has to fail here, in CI, rather than at a deploy
      # nobody is watching.
      - name: The runtime manifest is current
        run: node scripts/build_manifest.mjs --check

  # COVERAGE, ENFORCED RATHER THAN REPORTED.
  #
  # WHY THE SUMMARY IS PARSED INSTEAD OF A FLAG BEING PASSED. Node 22 has --test-coverage-lines,
  # --test-coverage-branches and --test-coverage-functions. This repository declares
  # "node": ">=20" and this workflow pins 20, where those flags do not exist: node 20.20.2 answers
  # `bad option: --test-coverage-lines=99` and exits without running anything. That was checked on
  # the runtime before the gate was written, because a gate built on a flag the runtime rejects is
  # a gate that never runs.
  #
  # TWO LEVELS, BOTH BLOCKING, AND NEITHER REPLACES THE OTHER.
  #
  #   1. src/probe/observe.js, the measurement layer, which is what a wrong reading here would
  #      come from. It is above the floor and this step keeps it there.
  #   2. The aggregate `all files` row, which is the pinned ruler and is BELOW the floor today.
  #
  # The aggregate is depressed by something no test can fix from here: node writes one coverage
  # record per module INSTANCE, and tests/unit/ui_state.test.js imports `src/ui/app.js?fresh=N`
  # once per mount, so one 635 line file is counted eighteen times in the denominator. Measured on
  # 369c769, that is 11,430 of 24,621 counted lines, together at 65.80 percent, against a union
  # across those eighteen records of 95.75 percent. Everything that is not app.js is already at
  # 95.38 percent of lines; set it to 100 and the aggregate reaches 84.12, so the floor cannot be
  # met by writing more tests. The gate prints the eighteen rows when it fails, so the number is
  # attributable rather than mysterious, and the step stays red until the harness or app.js is
  # fixed. Widening the floor to make it green would be the wrong repair.
  #
  # Those figures carry a date and a commit because they will drift. Reproduce them by reading the
  # `18 rows for src/ui/app.js` line the gate prints on any failing run.
  coverage:
    name: Coverage thresholds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: The gate proves it can fail, then runs
        run: node tests/unit/coverage_gate.mjs --selftest

      # `tee` rather than a redirect, so a failing suite still fails this job rather than being
      # swallowed by a redirect that always succeeds.
      #
      # `shell: bash` IS LOAD BEARING AND IS NOT DECORATION. The default shell on a linux runner is
      # `bash -e`, which has no pipefail, so the exit code of a pipeline is the exit code of `tee`
      # and `tee` always succeeds. Without this line a failing suite would pass this step while the
      # comment above claimed it could not, which is a gate that is fail open and says otherwise.
      # Naming the shell turns it into `bash --noprofile --norc -eo pipefail`.
      - name: Measure
        shell: bash
        run: node --experimental-test-coverage --test tests/unit | tee coverage.txt

      - name: The measurement layer is above the floor
        run: >
          node tests/unit/coverage_gate.mjs coverage.txt --threshold=85 --only-files
          --file=src/probe/observe.js

      - name: The whole suite is above the floor
        run: node tests/unit/coverage_gate.mjs coverage.txt --threshold=85

  style:
    name: Style gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: The gate proves it can fail, then runs
        run: node scripts/check_style.mjs --selftest

  e2e:
    name: The command the README gives, on a clean machine
    runs-on: ubuntu-latest
    steps:
      # NO CHECKOUT ON PURPOSE. The point of this job is to run what a reader runs: one line, no
      # clone, nothing built here. A checkout would let a file that `files` does not pack pass
      # unnoticed, which is exactly the failure this exists to catch, and it would land on whoever
      # ran the one command the README tells them to run.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Which commit to install
        id: ref
        run: |
          if [ -n "${{ github.event.pull_request.head.sha }}" ]; then
            echo "sha=${{ github.event.pull_request.head.sha }}" >> "$GITHUB_OUTPUT"
          else
            echo "sha=${{ github.sha }}" >> "$GITHUB_OUTPUT"
          fi

      - name: Which install form actually works
        id: form
        run: |
          SHA="${{ steps.ref.outputs.sha }}"
          echo "npm $(npm --version), node $(node --version)"
          try () {
            echo "--- trying: $1"
            if timeout 240 npx --yes "$1" --help > help.txt 2>err.txt; then
              if grep -q "behavioural conformance suite for WebMCP" help.txt; then
                echo "WORKS: $1"; echo "spec=$1" >> "$GITHUB_OUTPUT"; return 0
              fi
              echo "ran but the help text was not ours"
            fi
            sed -n '1,4p' err.txt || true
            return 1
          }
          try "github:upgradedev/ninthtool#$SHA" && exit 0
          try "https://github.com/upgradedev/ninthtool/tarball/$SHA" && exit 0
          try "git+https://github.com/upgradedev/ninthtool.git#$SHA" && exit 0
          echo "no install form worked, so the README cannot promise one"
          exit 1

      - name: It installs and starts
        run: |
          set -e
          grep -q "behavioural conformance suite for WebMCP" help.txt
          grep -q -- "--allow-fixture-forms" help.txt
          echo "the bin resolved, every import loaded, and the help text is the shipped one."

      - name: It refuses bad arguments before launching anything
        run: |
          set +e
          npx --yes "${{ steps.form.outputs.spec }}" --fail-on wrong > out.txt 2>&1
          code=$?
          set -e
          [ "$code" = "2" ] || { echo "expected exit 2 for a bad --fail-on, got $code"; cat out.txt; exit 1; }
          grep -q "Nothing was launched" out.txt
          echo "strict parsing survives packaging."

      - name: Where is Chrome
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /opt/google/chrome/chrome; do
            if [ -x "$c" ]; then echo "Chrome at $c"; exit 0; fi
          done
          echo "No Chrome on this runner, so the audit step below cannot prove anything."
          exit 1

      - name: It audits the live page, one behaviour, and calls nothing of its own
        run: |
          # NO `|| true`. It used to be here, and it meant this step asserted the OUTPUT while
          # ignoring the exit code entirely, so the documented semantics were never tested and a
          # runner-side failure would have been read as a pass by the greps below.
          #
          # A scoped A1 run against the live page is COMPLETE, so the documented code is 0. If it
          # ever is not, that is the gate doing its job rather than something to route around.
          set +e
          npx --yes "${{ steps.form.outputs.spec }}"             https://upgradedev.github.io/ninthtool/ --behaviour A1 > audit.txt 2>&1
          code=$?
          set -e
          cat audit.txt
          [ "$code" = "0" ] || { echo "a complete scoped run must exit 0, got $code (3 means incomplete)"; exit 1; }
          grep -q "scope   : A1" audit.txt
          grep -q "1 tested" audit.txt
          # Nothing belonging to the page under test may have been called without authorisation.
          grep -q "refused : " audit.txt || echo "note: A1 needs no authorisation, so nothing was refused"
          echo "one behaviour ran, and only one."

  # THE SAFETY PROPERTIES, RUN RATHER THAN ASSERTED FROM THE SOURCE.
  #
  # This suite's central claim is that it writes nothing to a page it was not authorised to write
  # to. Until now that claim was checked by unit tests over fake tools plus a grep of the CLI's own
  # text, and the end-to-end file that actually drives a browser against a page IMITATING the
  # bundled fixture was never run in CI. Two reachable defects had already been found in exactly
  # that boundary, so the file that would have caught them belongs in the pipeline.
  #
  # It needs a checkout and a real Chrome, which is why it cannot live in the no-checkout e2e job.
  integration:
    name: Side effect isolation, against an imitating page
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Where is Chrome
        run: |
          for c in /usr/bin/google-chrome /usr/bin/google-chrome-stable /opt/google/chrome/chrome; do
            if [ -x "$c" ]; then echo "Chrome at $c"; exit 0; fi
          done
          echo "No Chrome on this runner, so the isolation run below cannot prove anything."
          exit 1

      # The exit code gates the job. The script prints PASS or FAIL per counter and exits non-zero
      # on any of them, so there is nothing to grep and nothing to swallow.
      - name: Every counter that must stay at zero stays at zero
        run: node tests/integration/side_effect_isolation.mjs
